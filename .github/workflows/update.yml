# Weekly updates (see docs/updates.md): `nix run .#update` bumps flake inputs
# (NixOS, k3s, Helm charts) and pinned image digests, then every test runs.
# - all green, no Helm chart major version change: committed to main. Argo CD
#   deploys the apps; the nodes pick it up in their nightly self-upgrade.
# - a test failed, or a major version changed: opened as a pull request for
#   you, with the summary.
# It merges by itself rather than auto-merging a PR because GitHub doesn't run
# CI on pull requests opened with the workflow's own token.
name: Weekly updates

on:
  schedule:
    - cron: "0 1 * * 1" # Mondays 01:00 UTC
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"

      - name: Update
        id: update
        run: nix run .#update

      # The VM tests one after another (together they starve a runner),
      # then everything else.
      - name: Run all tests
        id: checks
        if: steps.update.outputs.changed == 'true'
        continue-on-error: true
        run: |
          nix build --no-link --print-build-logs .#checks.x86_64-linux.vm-cluster
          nix build --no-link --print-build-logs .#checks.x86_64-linux.vm-minimal
          nix build --no-link --print-build-logs .#checks.x86_64-linux.vm-sso
          nix build --no-link --print-build-logs .#checks.x86_64-linux.vm-monitoring
          nix build --no-link --print-build-logs .#checks.x86_64-linux.vm-monitoring-full
          nix flake check --print-build-logs --keep-going

      - name: Merge
        if: steps.update.outputs.changed == 'true' && steps.checks.outcome == 'success' && steps.update.outputs.majors == ''
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.update.outputs.summary }}
        run: |
          git commit -m "chore: weekly update" -m "$SUMMARY" -m "All tests passed."
          git push origin HEAD:main
          # Pushes with the workflow token don't trigger other workflows.
          if [ -f .github/workflows/k8s-render.yml ]; then gh workflow run k8s-render.yml --ref main; fi
          gh workflow run ci.yml --ref main

      - name: Open a pull request instead
        if: steps.update.outputs.changed == 'true' && (steps.checks.outcome != 'success' || steps.update.outputs.majors != '')
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.update.outputs.summary }}
          MAJORS: ${{ steps.update.outputs.majors }}
          CHECKS: ${{ steps.checks.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="update/$(date -u +%Y-%m-%d)"
          git checkout -b "$branch"
          git commit -m "chore: weekly update" -m "$SUMMARY"
          git push --force origin "$branch"
          {
            echo "Weekly update from [this run]($RUN_URL). It wasn't merged automatically:"
            echo
            if [ "$CHECKS" != success ]; then echo "- **Tests failed.** See the run's \"Run all tests\" step."; fi
            if [ -n "$MAJORS" ]; then echo "- **Major version changes** (check the release notes):"; echo '```'; echo "$MAJORS"; echo '```'; fi
            echo
            echo "Changes:"; echo '```'; echo "$SUMMARY"; echo '```'
          } > body.md
          gh pr create --base main --head "$branch" --title "Weekly update $(date -u +%Y-%m-%d)" --body-file body.md \
            || gh pr edit "$branch" --body-file body.md
