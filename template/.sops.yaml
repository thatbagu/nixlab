# `nix run .#init` puts your age public key here. To do it by hand:
#   age-keygen -o ~/.config/sops/age/keys.txt
#   age-keygen -y ~/.config/sops/age/keys.txt   # prints the public key
keys:
  - &primary age1REPLACE_WITH_YOUR_AGE_PUBLIC_KEY
creation_rules:
  - path_regex: secrets\.yaml$
    key_groups:
    - age:
      - *primary
