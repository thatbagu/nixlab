name: Deploy docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mdBook 0.5+ lists each page's sections in the sidebar as folding
      # entries (with fold.enable in book.toml).
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Download mermaid.js
        run: |
          curl -sSL https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js \
            -o docs/mermaid.min.js

      - name: Generate mermaid-init.js
        run: |
          # Before mermaid draws (it starts on page load, so an init on 'load'
          # comes too late and leaves dark text on the dark page): match the
          # book's theme.
          cat > docs/mermaid-init.js << 'EOF'
          mermaid.initialize({
            startOnLoad: true,
            theme: ['coal', 'navy', 'ayu'].some(t => document.documentElement.classList.contains(t)) ? 'dark' : 'default',
          });
          EOF

      - name: Build docs
        run: nix shell nixpkgs#mdbook nixpkgs#mdbook-mermaid --command mdbook build docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
