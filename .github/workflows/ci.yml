# Tests for every pull request and push to main.
#
# nixlab's tests: `nix flake check` (tests/), split into parallel jobs.
# Docs-only changes skip it. (Homelab repos get their own CI from template/.)
name: CI

on:
  pull_request:
    paths-ignore: ["docs/**", "**.md", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `nix flake check`'s checks (tests/default.nix), in the template and in
  # your copy, split into parallel jobs: the slow ones (host builds, VM tests)
  # each get their own. Every job caches its Nix store between runs, so things
  # like the VM tests' container images aren't fetched again.
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [quick, hosts, vm-cluster, vm-minimal, vm-sso, vm-monitoring, vm-monitoring-full]
    name: checks (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.group }}-${{ hashFiles('flake.lock', '**/*.nix', 'tests/**', 'apps/**') }}
          restore-prefixes-first-match: nix-${{ matrix.group }}-
          # GitHub keeps 10 GB of caches per repo: keep each group's small and
          # drop superseded ones.
          gc-max-store-size-linux: 3G
          purge: true
          purge-prefixes: nix-${{ matrix.group }}-
          purge-created: 0
          purge-primary-key: never
      - name: Select checks
        env:
          GROUP: ${{ matrix.group }}
        run: |
          # quick: everything but the host builds and VM tests.
          filter='n: let g = builtins.getEnv "GROUP"; in
            if g == "quick" then !(builtins.elem n [ "host-master" "host-worker" "vm-cluster" "vm-minimal" "vm-sso" "vm-monitoring" "vm-monitoring-full" ])
            else if g == "hosts" then builtins.elem n [ "host-master" "host-worker" ]
            else n == g'
          nix eval --impure --json .#checks.x86_64-linux --apply "c: builtins.filter ($filter) (builtins.attrNames c)" \
            | jq -r '.[] | ".#checks.x86_64-linux." + .' > checks.txt
          echo "Building: $(tr '\n' ' ' < checks.txt)"
      - name: Build checks
        run: xargs nix build --no-link --print-build-logs --keep-going < checks.txt
