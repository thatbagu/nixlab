# Tests for every pull request and push to main.
#
# The tests are `nix flake check` (tests/), split into parallel jobs. In your
# own copy, `your-config` also renders your real manifests and builds every
# one of your nodes. Docs-only changes skip all of it.
name: CI

on:
  pull_request:
    paths-ignore: ["docs/**", "**.md", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `nix flake check`'s checks (tests/default.nix), in the template and in
  # your copy, split into parallel jobs: the slow ones (host builds, VM tests)
  # each get their own. Every job caches its Nix store between runs, so things
  # like the VM tests' container images aren't fetched again.
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [quick, hosts, vm-cluster, vm-monitoring]
    name: checks (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.group }}-${{ hashFiles('flake.lock', '**/*.nix', 'tests/**', 'apps/**') }}
          restore-prefixes-first-match: nix-${{ matrix.group }}-
          # GitHub keeps 10 GB of caches per repo: keep each group's small and
          # drop superseded ones.
          gc-max-store-size-linux: 3G
          purge: true
          purge-prefixes: nix-${{ matrix.group }}-
          purge-created: 0
          purge-primary-key: never
      - name: Select checks
        env:
          GROUP: ${{ matrix.group }}
        run: |
          # quick: everything but the host builds and VM tests.
          filter='n: let g = builtins.getEnv "GROUP"; in
            if g == "quick" then !(builtins.elem n [ "host-master" "host-worker" "vm-cluster" "vm-monitoring" ])
            else if g == "hosts" then builtins.elem n [ "host-master" "host-worker" ]
            else n == g'
          nix eval --impure --json .#checks.x86_64-linux --apply "c: builtins.filter ($filter) (builtins.attrNames c)" \
            | jq -r '.[] | ".#checks.x86_64-linux." + .' > checks.txt
          echo "Building: $(tr '\n' ' ' < checks.txt)"
      - name: Check that the flake evaluates
        if: matrix.group == 'quick'
        run: nix flake check --no-build
      - name: Build checks
        run: xargs nix build --no-link --print-build-logs < checks.txt

  # Your homelab (any repo but the template): render your manifests and build
  # every node in vars.nix, so a broken change never reaches the cluster.
  # secrets.yaml stays encrypted: sops-nix only checks the keys exist.
  your-config:
    if: github.repository != 'thatbagu/nixlab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Render Kubernetes manifests
        run: nix build --no-link --print-build-logs .#nixidyEnvs.x86_64-linux.homelab.environmentPackage
      - name: Build every node
        run: |
          hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]')
          if [[ -z "$hosts" ]]; then echo "No nodes in vars.nix yet."; exit 0; fi
          for h in $hosts; do
            echo "::group::$h"
            nix build --no-link --print-build-logs ".#nixosConfigurations.$h.config.system.build.toplevel"
            echo "::endgroup::"
          done
