# Tests for every pull request and push to main.
#
# nixlab's tests: `nix flake check` (tests/), split into parallel jobs.
# Docs-only changes skip it. (Homelab repos get their own CI from template/.)
name: CI

on:
  pull_request:
    paths-ignore: ["docs/**", "**.md", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `nix flake check`'s checks (tests/default.nix), in the template and in
  # your copy, split into parallel jobs: the slow ones (host builds, VM tests)
  # each get their own. Every job caches its Nix store between runs, so things
  # like the VM tests' container images aren't fetched again.
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [quick, quick-eval, quick-render, hosts, vm-cluster, vm-minimal, vm-sso, vm-gateway, vm-ha, vm-longhorn, vm-install, vm-single, vm-install-encrypted, vm-nas, vm-power, vm-tailscale, vm-monitoring, vm-monitoring-full]
    name: checks (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Helm charts from the public binary cache, not from GitHub release
      # pages (which time out for hours at a time). Reading needs no token;
      # pushing (below) only happens where the CACHIX_AUTH_TOKEN secret is set.
      - uses: cachix/cachix-action@v16
        with:
          name: thatbagu0nixlab
          skipPush: true
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.group }}-${{ hashFiles('flake.lock', '**/*.nix', 'tests/**', 'apps/**') }}
          restore-prefixes-first-match: nix-${{ matrix.group }}-
          # GitHub keeps 10 GB of caches per repo: keep each group's small and
          # drop superseded ones.
          gc-max-store-size-linux: 3G
          purge: true
          purge-prefixes: nix-${{ matrix.group }}-
          purge-created: 0
          purge-primary-key: never
      - name: Select checks
        env:
          GROUP: ${{ matrix.group }}
        run: |
          # quick: everything but the host builds and VM tests, split in
          # three (eval-*, render-*, the rest) so no single job evaluates
          # everything at once: together they exhaust a runner's memory.
          filter='n: let
              g = builtins.getEnv "GROUP";
              vmsAndHosts = [ "host-master" "host-worker" "vm-cluster" "vm-minimal" "vm-sso" "vm-gateway" "vm-ha" "vm-longhorn" "vm-install" "vm-single" "vm-install-encrypted" "vm-nas" "vm-power" "vm-tailscale" "vm-monitoring" "vm-monitoring-full"];
              prefix = p: builtins.substring 0 (builtins.stringLength p) n == p;
            in
            if g == "quick" then !(builtins.elem n vmsAndHosts) && !(prefix "eval-") && !(prefix "render-")
            else if g == "quick-eval" then prefix "eval-"
            else if g == "quick-render" then prefix "render-"
            else if g == "hosts" then builtins.elem n [ "host-master" "host-worker" ]
            else n == g'
          nix eval --impure --json .#checks.x86_64-linux --apply "c: builtins.filter ($filter) (builtins.attrNames c)" \
            | jq -r '.[] | ".#checks.x86_64-linux." + .' > checks.txt
          echo "Building: $(tr '\n' ' ' < checks.txt)"
      - name: Build checks
        # Helm charts download from GitHub release pages, which time out now
        # and then (504). Retry only for that: what downloaded stays in the
        # store, and real failures still fail on the first attempt.
        run: |
          for attempt in 1 2 3; do
            set +e
            xargs nix build --no-link --print-build-logs --keep-going < checks.txt 2>&1 | tee build.log
            status=${PIPESTATUS[0]}
            set -e
            [ "$status" = 0 ] && exit 0
            grep -qE 'failed to fetch https://github\.com/[^ ]+ : 5[0-9][0-9]' build.log || exit "$status"
            echo "::warning::A GitHub release download failed; retrying (attempt $attempt of 3)"
            sleep 30
          done
          exit 1
      # Cache new chart downloads (only those: everything else is rebuilt
      # cheaply), even when the build failed further on.
      - name: Push chart downloads to the binary cache
        if: always()
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          # No token (e.g. a pull request from a fork): read-only.
          [ -n "$CACHIX_AUTH_TOKEN" ] || { echo "No CACHIX_AUTH_TOKEN; not pushing."; exit 0; }
          shopt -s nullglob
          charts=()
          for p in /nix/store/*-helm-chart-*; do
            [[ "$(basename "$p")" =~ ^[a-z0-9]{32}-helm-chart- && "$p" != *.drv ]] && charts+=("$p")
          done
          [ ${#charts[@]} = 0 ] || cachix push thatbagu0nixlab "${charts[@]}"

  # tools/nixlab.sh, nixlab without Nix installed, on machines without Nix.
  # Linux: Ubuntu's default block on user namespaces is explained; with them
  # allowed (as the message says), a homelab repo from the template,
  # rendered, and a tool run, all through Nix's static build with its store
  # in the home folder.
  # macOS: the VM can't start on GitHub's runners (no nested
  # virtualization), so only Lima's download and checksum.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: portable (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - name: No Nix here
        run: "! command -v nix"
      - name: Ubuntu's block on user namespaces is explained
        if: runner.os == 'Linux'
        run: |
          status=0; sh tools/nixlab.sh doctor 2>doctor.log || status=$?
          cat doctor.log
          [ "$status" = 1 ] && grep -q 'apparmor_restrict_unprivileged_userns=0' doctor.log
      - name: Allow them, as the message says
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: sh tools/nixlab.sh doctor
      - name: A homelab repo, rendered, and a tool, through static Nix
        if: runner.os == 'Linux'
        env:
          NIXLAB_TEMPLATE_DIR: ${{ github.workspace }}/template
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          cd "$RUNNER_TEMP"
          sh "$GITHUB_WORKSPACE/tools/nixlab.sh" new demo
          cd demo
          # This commit of nixlab, not the released one.
          sed -i "s|github:thatbagu/nixlab|path:$GITHUB_WORKSPACE|" flake.nix
          git add -A
          sh "$GITHUB_WORKSPACE/tools/nixlab.sh" render
          # Plain files you can open (not links into the store).
          test -f result/apps/Application-argocd.yaml
          # A tool runs: wake without a node prints its usage (exit 2).
          status=0; sh "$GITHUB_WORKSPACE/tools/nixlab.sh" wake 2>wake.log || status=$?
          cat wake.log; [ "$status" = 2 ] && grep -q usage wake.log
