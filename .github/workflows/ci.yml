# Tests for every pull request and push to main.
#
# Most tests are `nix flake check` (tests/). In your own copy, `your-config`
# also renders your real manifests and builds every one of your nodes.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `nix flake check` runs tests/ (see tests/default.nix), in the template and
  # in your copy: every configuration variant renders and evaluates, a sample
  # master and worker build, feature switches and validation behave, the alert
  # rules pass their unit tests, the helpers pass shellcheck, and a NixOS VM
  # boots the real master config with k3s, secrets, Argo CD and an app.
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs

  # Your homelab (any repo but the template): render your manifests and build
  # every node in vars.nix, so a broken change never reaches the cluster.
  # secrets.yaml stays encrypted: sops-nix only checks the keys exist.
  your-config:
    if: github.repository != 'thatbagu/nixlab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Render Kubernetes manifests
        run: nix build --no-link --print-build-logs .#nixidyEnvs.x86_64-linux.homelab.environmentPackage
      - name: Build every node
        run: |
          hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]')
          if [[ -z "$hosts" ]]; then echo "No nodes in vars.nix yet."; exit 0; fi
          for h in $hosts; do
            echo "::group::$h"
            nix build --no-link --print-build-logs ".#nixosConfigurations.$h.config.system.build.toplevel"
            echo "::endgroup::"
          done
