# Render the Kubernetes manifests (nixidy env .#homelab) and commit them to the
# branch Argo CD syncs from (vars.nix: renderedBranch, default k8s-rendered).
name: Render k8s manifests

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "vars.nix"
      - "flake.nix"
      - "flake.lock"
  workflow_dispatch:

# Renders must land in push order.
concurrency:
  group: k8s-render
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # Helm charts from nixlab's public binary cache, not from GitHub release
      # pages (which time out for hours at a time): your charts are the same
      # store paths as nixlab's. Reading needs no account. Your own Cachix
      # cache: set the CACHIX_CACHE variable and CACHIX_AUTH_TOKEN secret.
      # (Using a cache means trusting its signing key; remove this step to
      # build everything yourself.)
      - uses: cachix/cachix-action@v16
        with:
          name: ${{ vars.CACHIX_CACHE || 'thatbagu0nixlab' }}
          extraPullNames: thatbagu0nixlab
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Read target branch from vars.nix
        id: target
        run: echo "branch=$(nix eval --raw --impure --expr '(import ./vars.nix).renderedBranch or "k8s-rendered"')" >> "$GITHUB_OUTPUT"

      # A chart missing from the caches downloads from GitHub, which times out
      # now and then (504): retry only for that.
      - name: Build nixidy environment
        id: build
        run: |
          for attempt in 1 2 3; do
            set +e
            nix build --no-link --print-out-paths --print-build-logs .#nixidyEnvs.x86_64-linux.homelab.environmentPackage > out.txt 2> build.log
            status=$?
            set -e
            cat build.log
            if [ "$status" = 0 ]; then echo "out-path=$(tail -1 out.txt)" >> "$GITHUB_OUTPUT"; exit 0; fi
            grep -qE 'failed to fetch https://github\.com/[^ ]+ : 5[0-9][0-9]' build.log || exit "$status"
            echo "::warning::A GitHub release download failed; retrying (attempt $attempt of 3)"
            sleep 30
          done
          exit 1

      # With your own cache: push new chart downloads to it (only those, so a
      # public cache never gets builds of your private config).
      - name: Push chart downloads to your binary cache
        if: always() && vars.CACHIX_CACHE != ''
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHE: ${{ vars.CACHIX_CACHE }}
        run: |
          [ -n "$CACHIX_AUTH_TOKEN" ] || { echo "No CACHIX_AUTH_TOKEN; not pushing."; exit 0; }
          shopt -s nullglob
          charts=()
          for p in /nix/store/*-helm-chart-*; do
            [[ "$(basename "$p")" =~ ^[a-z0-9]{32}-helm-chart- && "$p" != *.drv ]] && charts+=("$p")
          done
          [ ${#charts[@]} = 0 ] || cachix push "$CACHE" "${charts[@]}"

      - name: Commit rendered manifests
        env:
          OUT: ${{ steps.build.outputs.out-path }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898273+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git worktree add rendered "origin/$BRANCH"
            cd rendered && git checkout -B "$BRANCH"
          else
            # First run: create the branch with no history from main.
            git worktree add --orphan -b "$BRANCH" rendered
            cd rendered
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name README.md -exec rm -rf {} +
          cp -rL --no-preserve=mode "$OUT"/. .
          [ -f README.md ] || printf '# %s\n\nGenerated Kubernetes manifests. Do not edit by hand: CI renders them\nfrom main (vars.nix, apps/, nixlab). Argo CD syncs from here.\n' "$BRANCH" > README.md
          git add -A
          if git diff --cached --quiet; then
            echo "Rendered manifests unchanged."
            exit 0
          fi
          git commit -m "render: main@${GITHUB_SHA::7}"
          git push origin "HEAD:$BRANCH"
