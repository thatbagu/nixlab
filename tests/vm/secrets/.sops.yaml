# The VM tests' Kubernetes Secrets, encrypted for tests/vm/age-key.txt with
# the rule nix run .#secrets puts in a homelab repo's .sops.yaml.
creation_rules:
  - path_regex: k8s/.*\.yaml$
    unencrypted_regex: ^(apiVersion|kind|metadata|type|RESTIC_REPOSITORY|AWS_DEFAULT_REGION|AWS_ENDPOINTS|admin-user)$
    mac_only_encrypted: true
    age: age17nvugwt3ztpgmuvswtartuxztx7gqv25l4lzdra7j52uz2u49sxsczc9tx
