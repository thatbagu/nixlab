[book]
title = "nixlab"
authors = ["thatbagu"]
description = "A NixOS and k3s platform for running services on your own hardware."
src = "."

[build]
build-dir = "book"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "navy"
fold.enable = true
additional-js = ["mermaid.min.js", "mermaid-init.js"]
