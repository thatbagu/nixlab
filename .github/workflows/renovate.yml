# Renovate (renovate.json5, nixlab's preset renovate/default.json5): one pull
# request per update, tested by CI, compatible ones merged by themselves once
# CI passes. Self-hosted here because a chart's update needs Nix (its hash:
# nix run .#update -- fixup). Needs a token that may open pull requests and
# whose pull requests run CI (the workflow's own token can't): a fine-grained
# personal access token for this repo (Contents, Pull requests, Workflows,
# Issues: read and write) as the RENOVATE_TOKEN secret.
name: Renovate

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Helm charts from nixlab's public binary cache (GitHub's release pages
      # time out now and then).
      - uses: cachix/cachix-action@v16
        with:
          name: thatbagu0nixlab
          skipPush: true
      - name: Renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_PLATFORM: github
          # The renovate[bot] identity, not Renovate's default author (a real
          # account on GitHub, which would get the commits).
          RENOVATE_GIT_AUTHOR: "renovate[bot] <29139614+renovate[bot]@users.noreply.github.com>"
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          # Tools from this runner (Nix for flake.lock and the fixup).
          RENOVATE_BINARY_SOURCE: global
          RENOVATE_ALLOWED_COMMANDS: '["^nix run \\.#update -- fixup$"]'
          LOG_LEVEL: info
        run: |
          # Without the token, skip (with a warning) instead of failing daily.
          [ -n "$RENOVATE_TOKEN" ] || { echo "::warning::Renovate is off: set the RENOVATE_TOKEN secret to turn it on (see this workflow's header)"; exit 0; }
          nix run nixpkgs#renovate
