# Tests for every pull request and push to main.
#
# Most tests are `nix flake check` (tests/). In your own copy, `your-config`
# also renders your real manifests and builds every one of your nodes.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `nix flake check` runs tests/ (see tests/default.nix), in the template and
  # in your copy: every configuration variant renders and evaluates, a sample
  # master and worker build, feature switches and validation behave, the alert
  # rules pass their unit tests, the helpers pass shellcheck, and a NixOS VM
  # boots the real master config with k3s, secrets, Argo CD and an app.
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs

  # nix run .#init and .#new-app, end to end in a sandbox $HOME. Template only:
  # they expect its placeholders.
  scripts:
    if: github.repository == 'thatbagu/nixlab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - run: ci/scripts-test.sh

  # The monitoring stack for real on k3s: rules load, metrics are scraped,
  # the dead man's switch is pinged and an alert reaches a webhook.
  monitoring:
    if: github.repository == 'thatbagu/nixlab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: python3 ci/fixture.py monitoring-e2e
      - name: Render
        run: echo "ENV=$(nix build --no-link --print-out-paths .#nixidyEnvs.x86_64-linux.homelab.environmentPackage)" >> "$GITHUB_ENV"
      - name: Start k3s
        run: |
          docker run -d --privileged --name k3s -p 127.0.0.1:6443:6443 \
            docker.io/rancher/k3s:v1.37.1-k3s1 server --disable=traefik --disable=metrics-server
          for _ in $(seq 1 60); do docker exec k3s test -f /etc/rancher/k3s/k3s.yaml 2>/dev/null && break; sleep 2; done
          # node-exporter mounts / with HostToContainer propagation; real
          # nodes have a shared root mount, a container doesn't (kind does this too).
          docker exec k3s mount --make-rshared /
          docker exec k3s cat /etc/rancher/k3s/k3s.yaml > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Monitoring tests
        run: nix shell nixpkgs#kubectl --command ci/monitoring-test.sh "$ENV"
      - name: Diagnostics
        if: failure()
        run: |
          nix shell nixpkgs#kubectl --command sh -c '
            kubectl -n monitoring get pods -o wide
            kubectl get events -A --sort-by=.lastTimestamp | tail -40
            kubectl -n monitoring logs statefulset/alertmanager-kube-prometheus-stack-alertmanager -c alertmanager --tail=50 || true'

  # Your homelab (any repo but the template): render your manifests and build
  # every node in vars.nix, so a broken change never reaches the cluster.
  # secrets.yaml stays encrypted: sops-nix only checks the keys exist.
  your-config:
    if: github.repository != 'thatbagu/nixlab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Render Kubernetes manifests
        run: nix build --no-link --print-build-logs .#nixidyEnvs.x86_64-linux.homelab.environmentPackage
      - name: Build every node
        run: |
          hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]')
          if [[ -z "$hosts" ]]; then echo "No nodes in vars.nix yet."; exit 0; fi
          for h in $hosts; do
            echo "::group::$h"
            nix build --no-link --print-build-logs ".#nixosConfigurations.$h.config.system.build.toplevel"
            echo "::endgroup::"
          done
